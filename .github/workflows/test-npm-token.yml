name: Test NPM Token Access

on:
  push:
    branches:
      - feat/CHKOUTENGG-52904_2

jobs:
  test-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test NPM Token Access
        run: |
          echo "Testing NPM_TOKEN access..."
          
          if [ -n "$NPM_TOKEN" ]; then
            echo "✅ NPM_TOKEN is available"
            echo "Token length: ${#NPM_TOKEN}"
            echo "Token starts with: ${NPM_TOKEN:0:10}..."
          else
            echo "❌ NPM_TOKEN is not available"
          fi
          
          # Test npm registry access
          echo "Testing npm registry access..."
          if npm whoami --registry https://registry.npmjs.org/; then
            echo "✅ Successfully authenticated with npm registry"
          else
            echo "❌ Failed to authenticate with npm registry"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
